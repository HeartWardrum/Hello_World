<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown 笔记本 - Typora Pro 版</title>
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.11.0/dist/index.css"/>
    <style>
        /* ========== Typora Night 全局暗黑变量 ========== */
        :root {
            --bg-main: #20252b;       /* 核心编辑区背景（Typora碳黑） */
            --bg-sidebar: #1b1f23;    /* 侧边栏稍深色 */
            --border-color: #333842;  /* 细边框颜色 */
            --text-main: #bcc2cd;     /* 舒适主文本色 */
            --text-light: #7d8492;    /* 隐蔽说明文字 */
            --text-bright: #ffffff;   /* 纯白高亮 */
            --accent-color: #4fc3f7;  /* 冰蓝主题强调色 */
            --tree-hover: #2c313c;    /* 树节点悬停色 */
            --tree-active: #3e4451;   /* 选中活动节点 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            display: flex;
            background: var(--bg-main);
            color: var(--text-main);
        }
        
        /* ========== 侧边栏样式 ========== */
        .sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }
        
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 搜索框样式 */
        .search-container {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-bright);
            font-size: 13px;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .btn-primary {
            width: 100%;
            padding: 8px 12px;
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #2ea043; }
        
        .btn-secondary {
            width: 48%;
            padding: 6px 12px;
            background: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-secondary:hover { background: var(--border-color); }
        
        .button-group {
            display: flex;
            gap: 8px;
        }
        
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }
        .tree-node-content:hover { background: var(--tree-hover); }
        .tree-node-content.active {
            background: var(--tree-active);
            border-left-color: var(--accent-color);
        }
        .tree-node-content.active .name { color: var(--text-bright); font-weight: 500; }
        
        .tree-node-label {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }
        .tree-node-label .icon { font-size: 15px; width: 18px; text-align: center; }
        .tree-node-label .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: var(--text-main);
        }
        
        .file-actions { display: flex; gap: 4px; opacity: 0; }
        .tree-node-content:hover .file-actions { opacity: 1; }
        
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--text-light);
        }
        .action-btn:hover { background: var(--tree-active); color: var(--text-bright); }
        .action-btn.delete:hover { color: #f85149; }
        
        .tree-node-children { padding-left: 16px; }
        
        /* ========== 主编辑区样式 ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }
        
        .editor-header {
            padding: 12px 20px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .current-file {
            font-size: 13px;
            color: var(--text-bright);
            font-weight: 500;
        }
        
        .tool-btn {
            padding: 6px 14px;
            background: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: var(--border-color);
            border-color: var(--accent-color);
            color: var(--text-bright);
        }
        .tool-btn.active {
            background: #1f6feb;
            border-color: #58a6ff;
            color: #ffffff;
        }
        
        .editor-container {
            flex: 1;
            min-height: 0;
        }
        
        /* ========== Vditor 样式深度重置（强力注入 Typora 配色） ========== */
        .vditor {
            border: none !important;
            --panel-background-color: var(--bg-main) !important;
            --toolbar-background-color: var(--bg-sidebar) !important;
            --toolbar-icon-color: var(--text-main) !important;
            --toolbar-icon-hover-color: var(--accent-color) !important;
            --toolbar-border-color: var(--border-color) !important;
            --textarea-background-color: var(--bg-main) !important;
            --textarea-text-color: var(--text-main) !important;
            --content-background-color: var(--bg-main) !important;
        }
        
        /* 编辑预览区域细节修正 */
        .vditor-reset {
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            font-size: 15px !important;
            line-height: 1.6 !important;
        }
        .vditor-reset h1, .vditor-reset h2, .vditor-reset h3, 
        .vditor-reset h4, .vditor-reset h5, .vditor-reset h6 {
            color: var(--text-bright) !important;
            font-weight: 600 !important;
            margin-top: 24px !important;
            margin-bottom: 12px !important;
        }
        .vditor-reset h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .vditor-reset h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        
        .vditor-reset code {
            background-color: #282c34 !important;
            color: #e06c75 !important;
            padding: 2px 6px !important;
            border-radius: 4px !important;
            font-family: Consolas, Monaco, monospace !important;
        }
        .vditor-reset pre {
            background-color: #282c34 !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 6px !important;
        }
        .vditor-reset pre code { background-color: transparent !important; color: #abb2bf !important; }
        .vditor-reset blockquote {
            border-left: 4px solid var(--accent-color) !important;
            background-color: #252b33 !important;
            color: #9da5b4 !important;
            padding: 10px 15px !important;
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-sidebar); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        /* 对话框 */
        .dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 3000;
        }
        .dialog {
            background: var(--bg-sidebar); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 20px; min-width: 320px;
        }
        .dialog h4 { margin-bottom: 12px; color: var(--text-bright); }
        .dialog input {
            width: 100%; padding: 8px; background: var(--bg-main);
            border: 1px solid var(--border-color); border-radius: 4px; color: #fff; margin-bottom: 16px;
        }
        .dialog input:focus { outline: none; border-color: var(--accent-color); }
        .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }
        .dialog-buttons button { padding: 6px 14px; border-radius: 4px; cursor: pointer; border: none; }
        .dialog-buttons .confirm { background: #238636; color: #fff; }
        .dialog-buttons .cancel { background: #30363d; color: var(--text-main); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>📁 本地知识库</h3>
            <div class="search-container">
                <input type="text" id="searchBar" class="search-input" placeholder="🔍 搜索文件名...">
            </div>
            <button class="btn-primary" id="newFileRootBtn">+ 新建根目录文件</button>
            <div class="button-group">
                <button class="btn-secondary" id="newFolderRootBtn">📁 新建文件夹</button>
                <button class="btn-secondary" id="refreshBtn">🔄 刷新</button>
            </div>
        </div>
        <div class="file-tree" id="fileTree">
            <div class="loading" style="padding:20px; color:var(--text-light)">加载中...</div>
        </div>
    </div>
    
    <div class="main">
        <div class="editor-header">
            <span class="current-file" id="currentFileName">请选择文件开始编写</span>
            <div class="header-buttons">
                <button class="tool-btn" id="sourceCodeBtn">📄 源码视图</button>
            </div>
        </div>
        <div class="editor-container" id="editor-container"></div>
    </div>

    <script src="https://unpkg.com/vditor@3.11.0/dist/index.min.js"></script>
    <script>
        let rawTreeData = null;
        let currentFilePath = null;
        let vditor = null;
        let expandedFolders = new Set();
        let isSourceMode = false; // 严谨的状态控制开关
        
        const API_BASE = '/api';
        const EDITABLE_EXTS = ['.md', '.markdown', '.txt', '.mdx', '.json', '.js', '.css', '.html', '.py'];
        
        // ========== API 请求部分 ==========
        async function fetchTree() {
            const r = await fetch(`${API_BASE}/tree`);
            const d = await r.json();
            return d.tree;
        }
        async function fetchFileContent(path) {
            const r = await fetch(`${API_BASE}/file?path=${encodeURIComponent(path)}`);
            const d = await r.json();
            return d.content;
        }
        async function saveFile(path, content) {
            await fetch(`${API_BASE}/file?path=${encodeURIComponent(path)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
        }
        async function deleteItem(path) { await fetch(`${API_BASE}/item?path=${encodeURIComponent(path)}`, { method: 'DELETE' }); }
        async function renameItem(path, newName) {
            const r = await fetch(`${API_BASE}/rename?path=${encodeURIComponent(path)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newName })
            });
            return await r.json();
        }
        async function createFolder(path) { await fetch(`${API_BASE}/folder?path=${encodeURIComponent(path)}`, { method: 'POST' }); }

        // ========== 核心：重构并修复源代码按钮 ==========
        function toggleSourceMode() {
            if (!vditor || !currentFilePath) return;
            const btn = document.getElementById('sourceCodeBtn');
            
            // 1. 切换状态标记
            isSourceMode = !isSourceMode;
            if (isSourceMode) {
                btn.textContent = '✨ 实时渲染';
                btn.classList.add('active');
            } else {
                btn.textContent = '📄 源码视图';
                btn.classList.remove('active');
            }
            
            // 2. 备份当前文本，销毁旧实例，并彻底清空容器
            const currentContent = vditor.getValue();
            try { vditor.destroy(); } catch(e) {}
            document.getElementById('editor-container').innerHTML = '';
            
            // 3. 用新模式重新初始化编辑器
            initEditor(currentContent);
        }

        // ========== 渲染树形结构（融入实时搜索过滤） ==========
        function renderTree(nodes, container, parentPath = '', searchKeyword = '') {
            if (!nodes) return false;
            let hasVisibleNode = false;

            for (const node of nodes) {
                const fullPath = parentPath ? `${parentPath}/${node.name}` : node.name;
                const isMatch = node.name.toLowerCase().includes(searchKeyword.toLowerCase());
                
                let childContainer = null;
                let childMatched = false;

                if (node.type === 'folder' && node.children) {
                    childContainer = document.createElement('div');
                    childContainer.className = 'tree-node-children';
                    // 递归检查子节点
                    childMatched = renderTree(node.children, childContainer, fullPath, searchKeyword);
                }

                // 如果当前节点匹配，或者子节点有匹配项，或者搜索框为空，则渲染该节点
                if (isMatch || childMatched || !searchKeyword) {
                    hasVisibleNode = true;
                    const nodeDiv = document.createElement('div');
                    nodeDiv.className = 'tree-node';

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'tree-node-content';
                    if (currentFilePath === fullPath) contentDiv.classList.add('active');

                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'tree-node-label';

                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'icon';
                    if (node.type === 'folder') {
                        // 搜索时默认强制展开所有相符的夹
                        const isOpen = searchKeyword ? true : expandedFolders.has(fullPath);
                        iconSpan.textContent = isOpen ? '📂' : '📁';
                    } else {
                        iconSpan.textContent = node.name.endsWith('.md') ? '📝' : '📄';
                    }

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name';
                    nameSpan.textContent = node.name;

                    labelDiv.appendChild(iconSpan);
                    labelDiv.appendChild(nameSpan);

                    // 快捷操作按钮
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'file-actions';
                    
                    if (node.type === 'folder') {
                        const addF = document.createElement('button'); addF.className='action-btn'; addF.textContent='+';
                        addF.onclick=(e)=>{ e.stopPropagation(); createNewFile(fullPath); };
                        actionsDiv.appendChild(addF);
                    }
                    const ren = document.createElement('button'); ren.className='action-btn'; ren.textContent='✏️';
                    ren.onclick=(e)=>{ e.stopPropagation(); renameNode(fullPath, node.name); };
                    const del = document.createElement('button'); del.className='action-btn delete'; del.textContent='🗑';
                    del.onclick=(e)=>{ e.stopPropagation(); deleteNode(fullPath, node.type); };
                    
                    actionsDiv.appendChild(ren);
                    actionsDiv.appendChild(del);
                    contentDiv.appendChild(labelDiv);
                    contentDiv.appendChild(actionsDiv);

                    contentDiv.onclick = () => {
                        if (node.type === 'folder') {
                            if (expandedFolders.has(fullPath)) expandedFolders.delete(fullPath);
                            else expandedFolders.add(fullPath);
                            renderFullTree();
                        } else {
                            openFile(fullPath);
                        }
                    };

                    nodeDiv.appendChild(contentDiv);
                    if (node.type === 'folder' && (expandedFolders.has(fullPath) || searchKeyword) && childContainer) {
                        nodeDiv.appendChild(childContainer);
                    }
                    container.appendChild(nodeDiv);
                }
            }
            return hasVisibleNode;
        }

        async function renderFullTree() {
            try {
                if (!rawTreeData) rawTreeData = await fetchTree();
                const container = document.getElementById('fileTree');
                container.innerHTML = '';
                const keyword = document.getElementById('searchBar').value;
                renderTree(rawTreeData, container, '', keyword);
            } catch (err) {
                document.getElementById('fileTree').innerHTML = '<div style="padding:16px;color:#f85149;">加载服务连接失败</div>';
            }
        }

        // ========== 打开与保存文件 ==========
        async function openFile(filePath) {
            try {
                const content = await fetchFileContent(filePath);
                currentFilePath = filePath;
                document.getElementById('currentFileName').textContent = filePath;
                
                if (vditor) {
                    vditor.setValue(content);
                    // ⚠️ 这里彻底移除了原来导致报错的 vditor.setMode()
                } else {
                    initEditor(content);
                }
                await renderFullTree();
            } catch (err) {
                alert('读取文件失败: ' + err.message);
            }
        }

        // ========== 初始化大纲和拖拽图片上传的编辑器 ==========
        function initEditor(initialValue = '') {
            vditor = new Vditor('editor-container', {
                mode: isSourceMode ? 'sv' : 'ir', // 动态读取当前应该是源码还是渲染模式
                height: '100%',
                theme: 'dark',
                outline: {
                    enable: true,
                    position: 'right'
                },
                toolbar: [
                    'headings', 'bold', 'italic', 'strike', '|',
                    'list', 'ordered-list', 'check', '|',
                    'link', 'table', 'quote', 'code', 'inline-code', '|',
                    'undo', 'redo'
                ],
                after: () => {
                    // 编辑器初始化完成后，如果带有初始值（切换模式/新加载文件），则自动填入
                    if (initialValue) {
                        vditor.setValue(initialValue);
                    }
                },
                input: async (val) => {
                    if (currentFilePath) {
                        await saveFile(currentFilePath, val);
                    }
                },
                upload: {
                    handler: async (files) => {
                        const file = files[0];
                        if (!file.type.startsWith('image/')) {
                            alert('只支持上传图片格式文件');
                            return null;
                        }
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            try {
                                const res = await fetch('/api/upload', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ filename: file.name, base64Data: e.target.result })
                                });
                                const data = await res.json();
                                if (data.success) {
                                    vditor.insertValue(`![${file.name}](${data.url})`);
                                } else {
                                    alert('图片处理失败: ' + data.error);
                                }
                            } catch (err) {
                                alert('图片上传服务器失败: ' + err.message);
                            }
                        };
                        reader.readAsDataURL(file);
                        return null;
                    }
                }
            });
        }

        // ========== 其余辅助操作弹窗 ==========
        function showDialog(title, val, cb) {
            const overlay = document.createElement('div');
            overlay.className = 'dialog-overlay';
            overlay.innerHTML = `
                <div class="dialog">
                    <h4>${title}</h4>
                    <input type="text" id="dIn" value="${val}">
                    <div class="dialog-buttons">
                        <button class="cancel">取消</button>
                        <button class="confirm">确定</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#dIn');
            input.focus(); input.select();
            overlay.querySelector('.confirm').onclick = () => { const v=input.value.trim(); overlay.remove(); if(v) cb(v); };
            overlay.querySelector('.cancel').onclick = () => overlay.remove();
        }

        function createNewFile(parent = '') {
            showDialog('新建文件', '未命名文档.md', async (name) => {
                const p = parent ? `${parent}/${name}` : name;
                await saveFile(p, '# ' + name.replace('.md',''));
                rawTreeData = null; 
                await renderFullTree();
                await openFile(p);
            });
        }
        function createNewFolder(parent = '') {
            showDialog('新建文件夹', '新建文件夹', async (name) => {
                const p = parent ? `${parent}/${name}` : name;
                await createFolder(p);
                rawTreeData = null; await renderFullTree();
            });
        }
        function renameNode(oldPath, oldName) {
            showDialog('重命名', oldName, async (newName) => {
                const res = await renameItem(oldPath, newName);
                if (currentFilePath === oldPath) {
                    currentFilePath = res.newPath;
                    document.getElementById('currentFileName').textContent = res.newPath;
                }
                rawTreeData = null; await renderFullTree();
            });
        }
        async function deleteNode(path, type) {
            if (!confirm(`确定要删除此${type === 'folder' ? '文件夹及其全部内容' : '文件'}吗？`)) return;
            await deleteItem(path);
            if (currentFilePath === path) {
                currentFilePath = null;
                vditor.setValue('');
                document.getElementById('currentFileName').textContent = '请选择文件开始编写';
            }
            rawTreeData = null; await renderFullTree();
        }

        // ========== 绑定全局初始化事件 ==========
        document.getElementById('searchBar').oninput = () => renderFullTree();
        document.getElementById('newFileRootBtn').onclick = () => createNewFile('');
        document.getElementById('newFolderRootBtn').onclick = () => createNewFolder('');
        document.getElementById('refreshBtn').onclick = () => { rawTreeData = null; renderFullTree(); };
        document.getElementById('sourceCodeBtn').onclick = toggleSourceMode;

        initEditor();
        renderFullTree();
    </script>
</body>
</html>
