<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown 知识库</title>
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.11.0/dist/index.css"/>
    <style>
        /* ========== 全局变量 (保持 Typora 暗黑配色) ========== */
        :root {
            --bg-main: #20252b;
            --bg-sidebar: #1b1f23;
            --border-color: #333842;
            --text-main: #bcc2cd;
            --text-light: #7d8492;
            --text-bright: #ffffff;
            --accent-color: #4fc3f7;
            --tree-hover: #2c313c;
            --tree-active: #3e4451;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            background: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        /* ========== 🏠 起始页样式 (新加入) ========== */
        .home-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 5000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        .home-screen.hidden { opacity: 0; pointer-events: none; }
        
        .home-box {
            width: 100%; max-width: 600px; padding: 40px;
            background: var(--bg-sidebar); border: 1px solid var(--border-color);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .home-box h1 { color: var(--text-bright); text-align: center; margin-bottom: 30px; font-weight: 500;}
        
        .path-input-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .path-input-group input {
            flex: 1; padding: 12px 16px; font-size: 14px;
            background: var(--bg-main); border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff;
        }
        .path-input-group input:focus { outline: none; border-color: var(--accent-color); }
        .path-input-group button {
            padding: 0 20px; font-size: 14px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 500; transition: background 0.2s;
        }
        .btn-primary { background: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); color: var(--text-bright); }
        
        .favorites-list h4 { color: var(--text-light); margin-bottom: 12px; font-size: 13px; font-weight: normal;}
        .fav-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--bg-main); border-radius: 6px;
            margin-bottom: 8px; cursor: pointer; border: 1px solid transparent;
        }
        .fav-item:hover { border-color: var(--border-color); background: var(--tree-active); }
        .fav-path { color: var(--text-bright); font-family: monospace; font-size: 13px; }
        .fav-remove { color: var(--text-light); background: none; border: none; cursor: pointer; padding: 4px; }
        .fav-remove:hover { color: #f85149; }

        /* ========== 侧边栏及编辑器主体样式 (与之前相同) ========== */
        .sidebar { width: 320px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--accent-color); }
        .search-container { margin-bottom: 12px; }
        .search-input { width: 100%; padding: 6px 10px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-bright); font-size: 13px; }
        .button-group { display: flex; gap: 8px; margin-top: 8px; }
        .button-group button { flex: 1; padding: 6px; font-size: 12px; }
        
        .file-tree { flex: 1; overflow-y: auto; padding: 8px 0; }
        .tree-node-content { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent; }
        .tree-node-content:hover { background: var(--tree-hover); }
        .tree-node-content.active { background: var(--tree-active); border-left-color: var(--accent-color); }
        .tree-node-content.active .name { color: var(--text-bright); font-weight: 500; }
        .tree-node-label { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
        .tree-node-label .icon { font-size: 15px; width: 18px; text-align: center; }
        .tree-node-label .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .file-actions { display: flex; gap: 4px; opacity: 0; }
        .tree-node-content:hover .file-actions { opacity: 1; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px; color: var(--text-light); }
        .action-btn:hover { background: var(--tree-active); color: var(--text-bright); }
        .tree-node-children { padding-left: 16px; }
        
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .editor-header { padding: 12px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .current-file { font-size: 13px; color: var(--text-bright); font-weight: 500; }
        .tool-btn { padding: 6px 14px; background: #21262d; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-size: 12px; }
        .tool-btn:hover { background: var(--border-color); border-color: var(--accent-color); color: var(--text-bright); }
        .tool-btn.active { background: #1f6feb; border-color: #58a6ff; color: #ffffff; }
        .editor-container { flex: 1; min-height: 0; }
        
        /* 编辑器深度适配 */
        .vditor { border: none !important; --panel-background-color: var(--bg-main) !important; --toolbar-background-color: var(--bg-sidebar) !important; --toolbar-icon-color: var(--text-main) !important; --toolbar-icon-hover-color: var(--accent-color) !important; --toolbar-border-color: var(--border-color) !important; --textarea-background-color: var(--bg-main) !important; --textarea-text-color: var(--text-main) !important; --content-background-color: var(--bg-main) !important; }
        .vditor-reset { background-color: var(--bg-main) !important; color: var(--text-main) !important; font-size: 15px !important; line-height: 1.6 !important; }
        .vditor-reset h1, .vditor-reset h2, .vditor-reset h3, .vditor-reset h4 { color: var(--text-bright) !important; font-weight: 600 !important; margin-top: 24px !important; margin-bottom: 12px !important; }
        .vditor-reset code { background-color: #282c34 !important; color: #e06c75 !important; padding: 2px 6px !important; border-radius: 4px !important; }
        .vditor-reset pre { background-color: #282c34 !important; border: 1px solid var(--border-color) !important; border-radius: 6px !important; }
        .vditor-reset blockquote { border-left: 4px solid var(--accent-color) !important; background-color: #252b33 !important; color: #9da5b4 !important; padding: 10px 15px !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-sidebar); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* 对话框 */
        .dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 6000; }
        .dialog { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; min-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dialog h4 { margin-bottom: 12px; color: var(--text-bright); font-weight: 500;}
        .dialog input { width: 100%; padding: 8px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; color: #fff; margin-bottom: 16px; }
        .dialog input:focus { outline: none; border-color: var(--accent-color); }
        .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }
        .dialog-buttons button { padding: 6px 14px; border-radius: 4px; cursor: pointer; border: none; font-size: 13px;}
        .dialog-buttons .confirm { background: #238636; color: #fff; }
        .dialog-buttons .cancel { background: #30363d; color: var(--text-main); }
    </style>
</head>
<body>
    <div id="homeScreen" class="home-screen">
        <div class="home-box">
            <h1>📖 开启你的知识库</h1>
            <div class="path-input-group">
                <input type="text" id="rootPathInput" placeholder="请输入本地文件夹绝对路径，如: D:\文档\笔记">
                <button id="openRootBtn" class="btn-primary">打开</button>
                <button id="favRootBtn" class="btn-secondary">⭐ 收藏</button>
            </div>
            <div class="favorites-list" id="favoritesList">
                </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3>📁 当前知识库</h3>
            <div class="search-container">
                <input type="text" id="searchBar" class="search-input" placeholder="🔍 搜索文件名...">
            </div>
            <button class="btn-primary" id="newFileRootBtn" style="width: 100%; padding: 8px; margin-bottom: 8px;">+ 新建根目录文档</button>
            <div class="button-group">
                <button class="btn-secondary" id="newFolderRootBtn">📁 新建目录</button>
                <button class="btn-secondary" id="refreshBtn">🔄 刷新刷新</button>
            </div>
            <button class="btn-secondary" id="switchLibraryBtn" style="width: 100%; margin-top: 8px; border-color: #4fc3f7; color: #4fc3f7;">🏠 切换知识库</button>
        </div>
        <div class="file-tree" id="fileTree"></div>
    </div>
    
    <div class="main">
        <div class="editor-header">
            <span class="current-file" id="currentFileName">请从左侧选择文档</span>
            <button class="tool-btn" id="sourceCodeBtn">📄 源码视图</button>
        </div>
        <div class="editor-container" id="editor-container"></div>
    </div>

    <script src="https://unpkg.com/vditor@3.11.0/dist/index.min.js"></script>
    <script>
        let rawTreeData = null;
        let currentFilePath = null;
        let vditor = null;
        let expandedFolders = new Set();
        let isSourceMode = false;
        
        const API_BASE = '/api';

        // ========== 初始化与配置拉取 ==========
        async function initApp() {
            try {
                const res = await fetch(`${API_BASE}/config`);
                const config = await res.json();
                renderFavorites(config.favorites);
                
                if (config.currentRoot) {
                    document.getElementById('rootPathInput').value = config.currentRoot;
                    enterWorkspace();
                } else {
                    showHomeScreen();
                }
            } catch (e) {
                console.error("无法连接到本地服务器", e);
            }
        }

        // ========== 主页与工作区切换逻辑 ==========
        function showHomeScreen() { document.getElementById('homeScreen').classList.remove('hidden'); }
        async function enterWorkspace() {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('currentFileName').textContent = '请选择文件开始编写';
            currentFilePath = null;
            if (vditor) { vditor.destroy(); document.getElementById('editor-container').innerHTML = ''; vditor = null; }
            await renderFullTree();
        }

        document.getElementById('openRootBtn').onclick = async () => {
            const path = document.getElementById('rootPathInput').value.trim();
            if (!path) return;
            const res = await fetch(`${API_BASE}/config/root`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetPath: path })
            });
            const data = await res.json();
            if (data.success) enterWorkspace();
            else alert(data.error);
        };

        // 在输入框回车也能打开
        document.getElementById('rootPathInput').onkeydown = (e) => {
            if (e.key === 'Enter') document.getElementById('openRootBtn').click();
        };

        document.getElementById('favRootBtn').onclick = async () => {
            const path = document.getElementById('rootPathInput').value.trim();
            if (!path) return alert('请先输入路径');
            updateFavorite(path, 'add');
        };

        document.getElementById('switchLibraryBtn').onclick = showHomeScreen;

        async function updateFavorite(path, action) {
            const res = await fetch(`${API_BASE}/config/favorite`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ favPath: path, action })
            });
            const data = await res.json();
            if (data.success) renderFavorites(data.favorites);
        }

        function renderFavorites(favs) {
            const container = document.getElementById('favoritesList');
            if (favs.length === 0) {
                container.innerHTML = '<div style="color:var(--text-light); text-align:center; margin-top:20px; font-size:13px;">暂无收藏路径，输入绝对路径后点击上方收藏按钮即可添加。</div>';
                return;
            }
            container.innerHTML = '<h4>⭐ 收藏的知识库</h4>';
            favs.forEach(fav => {
                const item = document.createElement('div'); item.className = 'fav-item';
                
                const txt = document.createElement('span'); txt.className = 'fav-path'; txt.textContent = fav;
                txt.onclick = () => { document.getElementById('rootPathInput').value = fav; document.getElementById('openRootBtn').click(); };
                
                const btn = document.createElement('button'); btn.className = 'fav-remove'; btn.textContent = '❌';
                btn.onclick = (e) => { e.stopPropagation(); updateFavorite(fav, 'remove'); };
                
                item.appendChild(txt); item.appendChild(btn);
                container.appendChild(item);
            });
        }


        // ========== 核心操作：弹窗控制 (已修复回车确定) ==========
        function showDialog(title, val, cb) {
            const overlay = document.createElement('div');
            overlay.className = 'dialog-overlay';
            overlay.innerHTML = `
                <div class="dialog">
                    <h4>${title}</h4>
                    <input type="text" id="dIn" value="${val}">
                    <div class="dialog-buttons">
                        <button class="cancel btn-secondary">取消</button>
                        <button class="confirm btn-primary">确定</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#dIn');
            input.focus(); input.select();
            
            // ✨ 核心修复：监听回车键直接确认
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // 阻止默认行为（防止多重触发）
                    overlay.querySelector('.confirm').click();
                } else if (e.key === 'Escape') {
                    overlay.remove();
                }
            };

            overlay.querySelector('.confirm').onclick = () => { const v=input.value.trim(); overlay.remove(); if(v) cb(v); };
            overlay.querySelector('.cancel').onclick = () => overlay.remove();
        }

        // ========== API 请求 ==========
        async function fetchTree() { const r = await fetch(`${API_BASE}/tree`); const d = await r.json(); return d.tree; }
        async function fetchFileContent(path) { const r = await fetch(`${API_BASE}/file?path=${encodeURIComponent(path)}`); const d = await r.json(); return d.content; }
        async function saveFile(path, content) { await fetch(`${API_BASE}/file?path=${encodeURIComponent(path)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) }); }
        async function deleteItem(path) { await fetch(`${API_BASE}/item?path=${encodeURIComponent(path)}`, { method: 'DELETE' }); }
        async function renameItem(path, newName) { const r = await fetch(`${API_BASE}/rename?path=${encodeURIComponent(path)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newName }) }); return await r.json(); }
        async function createFolder(path) { await fetch(`${API_BASE}/folder?path=${encodeURIComponent(path)}`, { method: 'POST' }); }

        // ========== 文件树渲染与操作 ==========
        function renderTree(nodes, container, parentPath = '', searchKeyword = '') {
            if (!nodes) return false;
            let hasVisibleNode = false;
            for (const node of nodes) {
                const fullPath = parentPath ? `${parentPath}/${node.name}` : node.name;
                const isMatch = node.name.toLowerCase().includes(searchKeyword.toLowerCase());
                let childContainer = null; let childMatched = false;
                if (node.type === 'folder' && node.children) {
                    childContainer = document.createElement('div'); childContainer.className = 'tree-node-children';
                    childMatched = renderTree(node.children, childContainer, fullPath, searchKeyword);
                }
                if (isMatch || childMatched || !searchKeyword) {
                    hasVisibleNode = true;
                    const nodeDiv = document.createElement('div'); nodeDiv.className = 'tree-node';
                    const contentDiv = document.createElement('div'); contentDiv.className = 'tree-node-content';
                    if (currentFilePath === fullPath) contentDiv.classList.add('active');

                    const labelDiv = document.createElement('div'); labelDiv.className = 'tree-node-label';
                    const iconSpan = document.createElement('span'); iconSpan.className = 'icon';
                    iconSpan.textContent = node.type === 'folder' ? ((searchKeyword || expandedFolders.has(fullPath)) ? '📂' : '📁') : (node.name.endsWith('.md') ? '📝' : '📄');
                    const nameSpan = document.createElement('span'); nameSpan.className = 'name'; nameSpan.textContent = node.name;
                    labelDiv.appendChild(iconSpan); labelDiv.appendChild(nameSpan);

                    const actionsDiv = document.createElement('div'); actionsDiv.className = 'file-actions';
                    if (node.type === 'folder') {
                        const addF = document.createElement('button'); addF.className='action-btn'; addF.textContent='+';
                        addF.onclick=(e)=>{ e.stopPropagation(); createNewFile(fullPath); }; actionsDiv.appendChild(addF);
                    }
                    const ren = document.createElement('button'); ren.className='action-btn'; ren.textContent='✏️';
                    ren.onclick=(e)=>{ e.stopPropagation(); renameNode(fullPath, node.name); };
                    const del = document.createElement('button'); del.className='action-btn delete'; del.textContent='🗑';
                    del.onclick=(e)=>{ e.stopPropagation(); deleteNode(fullPath, node.type); };
                    
                    actionsDiv.appendChild(ren); actionsDiv.appendChild(del);
                    contentDiv.appendChild(labelDiv); contentDiv.appendChild(actionsDiv);

                    contentDiv.onclick = () => {
                        if (node.type === 'folder') {
                            if (expandedFolders.has(fullPath)) expandedFolders.delete(fullPath); else expandedFolders.add(fullPath);
                            renderFullTree();
                        } else { openFile(fullPath); }
                    };

                    nodeDiv.appendChild(contentDiv);
                    if (node.type === 'folder' && (expandedFolders.has(fullPath) || searchKeyword) && childContainer) nodeDiv.appendChild(childContainer);
                    container.appendChild(nodeDiv);
                }
            }
            return hasVisibleNode;
        }

        async function renderFullTree() {
            try {
                rawTreeData = await fetchTree();
                const container = document.getElementById('fileTree'); container.innerHTML = '';
                const keyword = document.getElementById('searchBar').value;
                renderTree(rawTreeData, container, '', keyword);
            } catch (err) {
                document.getElementById('fileTree').innerHTML = '<div style="padding:16px;color:#f85149;">加载目录失败</div>';
            }
        }

        // ========== 编辑器逻辑 (无缝重建模式) ==========
        function toggleSourceMode() {
            if (!vditor || !currentFilePath) return;
            const btn = document.getElementById('sourceCodeBtn');
            isSourceMode = !isSourceMode;
            if (isSourceMode) { btn.textContent = '✨ 实时渲染'; btn.classList.add('active'); }
            else { btn.textContent = '📄 源码视图'; btn.classList.remove('active'); }
            
            const currentContent = vditor.getValue();
            try { vditor.destroy(); } catch(e) {}
            document.getElementById('editor-container').innerHTML = '';
            initEditor(currentContent);
        }

        async function openFile(filePath) {
            try {
                const content = await fetchFileContent(filePath);
                currentFilePath = filePath;
                document.getElementById('currentFileName').textContent = filePath;
                if (vditor) vditor.setValue(content); else initEditor(content);
                await renderFullTree();
            } catch (err) { alert('读取文件失败: ' + err.message); }
        }

        function initEditor(initialValue = '') {
            vditor = new Vditor('editor-container', {
                mode: isSourceMode ? 'sv' : 'ir',
                height: '100%', theme: 'dark',
                outline: { enable: true, position: 'right' },
                toolbar: [ 'headings', 'bold', 'italic', 'strike', '|', 'list', 'ordered-list', 'check', '|', 'link', 'table', 'quote', 'code', 'inline-code', '|', 'undo', 'redo' ],
                after: () => { if (initialValue) vditor.setValue(initialValue); },
                input: async (val) => { if (currentFilePath) await saveFile(currentFilePath, val); },
                upload: {
                    handler: async (files) => {
                        const file = files[0];
                        if (!file.type.startsWith('image/')) return alert('只支持图片');
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            try {
                                const res = await fetch('/api/upload', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ filename: file.name, base64Data: e.target.result })
                                });
                                const data = await res.json();
                                if (data.success) vditor.insertValue(`![${file.name}](${data.url})`);
                                else alert('图片失败: ' + data.error);
                            } catch (err) { alert('上传错误: ' + err.message); }
                        };
                        reader.readAsDataURL(file);
                        return null;
                    }
                }
            });
        }

        // ========== DOM 事件绑定 ==========
        function createNewFile(parent = '') {
            showDialog('新建文件', '未命名.md', async (name) => {
                const p = parent ? `${parent}/${name}` : name;
                await saveFile(p, '# ' + name.replace('.md',''));
                await renderFullTree(); await openFile(p);
            });
        }
        function createNewFolder(parent = '') {
            showDialog('新建文件夹', '新建文件夹', async (name) => {
                const p = parent ? `${parent}/${name}` : name;
                await createFolder(p); await renderFullTree();
            });
        }
        function renameNode(oldPath, oldName) {
            showDialog('重命名', oldName, async (newName) => {
                const res = await renameItem(oldPath, newName);
                if (currentFilePath === oldPath) { currentFilePath = res.newPath; document.getElementById('currentFileName').textContent = res.newPath; }
                await renderFullTree();
            });
        }
        async function deleteNode(path, type) {
            if (!confirm(`确定删除此${type === 'folder' ? '文件夹及其全部内容' : '文件'}吗？`)) return;
            await deleteItem(path);
            if (currentFilePath === path) {
                currentFilePath = null; vditor.setValue('');
                document.getElementById('currentFileName').textContent = '请选择文件开始编写';
            }
            await renderFullTree();
        }

        document.getElementById('searchBar').oninput = renderFullTree;
        document.getElementById('newFileRootBtn').onclick = () => createNewFile('');
        document.getElementById('newFolderRootBtn').onclick = () => createNewFolder('');
        document.getElementById('refreshBtn').onclick = renderFullTree;
        document.getElementById('sourceCodeBtn').onclick = toggleSourceMode;

        // 启动应用
        initApp();
    </script>
</body>
</html>
